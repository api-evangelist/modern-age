name: Modern Age
description: 'Modern Age is a longevity-focused health and wellness clinic based on New York City''s
  Upper East Side. It provides proactive aging interventions including comprehensive Aging Wellness
  Assessments (blood work, bone-density scans, cognitive testing, and clinician consultation), IV drip
  therapies, vitamin injections, hormone therapy, medically supervised weight loss, and aesthetic skin
  and hair treatments. Backed by GV (Google Ventures), the company blends clinical diagnostics with
  wellness services to help members understand and proactively slow the aging process. Modern Age is a
  consumer health clinic and does not currently publish a public developer API or documentation surface.'
